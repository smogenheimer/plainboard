<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='3' fill='%23ff6d3d'/><rect x='7' y='8' width='5' height='16' fill='%231a0a06'/><rect x='14' y='8' width='5' height='11' fill='%231a0a06'/><rect x='21' y='8' width='5' height='7' fill='%231a0a06'/></svg>" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>PlainBoard</title>
    <script>
      // Before first paint, so the page never flashes in the wrong look (see src/lib/theme.ts,
      // which holds the list of designs; keep the theme names and the default here in step with it).
      (function () {
        var themes = { slop2gether: ["slop2gether-dark", "slop2gether-light"], fahrplan: ["carbon", "stone"], classic: ["classic-dark", "classic-light"] };
        var design = localStorage.getItem("plainboard.design");
        if (!themes[design]) design = "slop2gether";
        // Light or dark: what was chosen in the picker, else as the system.
        var mode = localStorage.getItem("plainboard.appearance");
        if (mode !== "dark" && mode !== "light") mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.design = design;
        document.documentElement.dataset.theme = themes[design][mode === "dark" ? 0 : 1];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
