<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236741d9'/><rect x='9' y='8' width='14' height='2.6' rx='1.3' fill='white'/><rect x='9' y='14.7' width='14' height='2.6' rx='1.3' fill='white'/><rect x='9' y='21.4' width='9' height='2.6' rx='1.3' fill='white'/></svg>" />
    <!--pb-docs-head-->
    <script>
      // A doc site always wears slop2gether (src/lib/theme.ts reads data-fixed-design), light or dark as
      // chosen on the site or in PlainBoard, else as the system. Set before the first paint.
      (function () {
        var root = document.documentElement;
        var mode = localStorage.getItem("plainboard.appearance");
        if (mode !== "dark" && mode !== "light") mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        root.dataset.fixedDesign = "slop2gether";
        root.dataset.design = "slop2gether";
        root.dataset.theme = mode === "dark" ? "slop2gether-dark" : "slop2gether-light";
        root.dataset.docs = "";
      })();
    </script>
  </head>
  <body>
    <div id="docs-root"><!--pb-docs-body--></div>
    <script type="module" src="/src/docs/main.tsx"></script>
  </body>
</html>
