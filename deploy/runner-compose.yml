# An external PlainBoard runner: lets a project's agents work on this server.
# Settings > Runners in PlainBoard shows this file with your URL and token filled in.
# Save it as docker-compose.yml in an empty folder, then: docker compose up -d
# It updates itself to PlainBoard's version. Should PlainBoard ask for it: docker compose pull && docker compose up -d
# The image must match PlainBoard: latest (or its X.Y.Z) for a release, edge for a PlainBoard on :edge or
# built from source. Choose it with RUNNER_TAG (in .env next to this file); PlainBoard fills in the right one.
services:
  runner:
    image: thoenehannes/plainboard-runner:${RUNNER_TAG:-latest}
    container_name: plainboard-runner
    restart: unless-stopped
    environment:
      PLAINBOARD_URL: https://plainboard.example.com   # the address you open PlainBoard at
      PLAINBOARD_RUNNER_TOKEN: pbr_replace-me          # shown once when you add the runner
    volumes:
      - workspaces:/workspaces
      - agent-home:/home/agent
      - uploads:/uploads                               # the project's attachments, copied once
volumes:
  workspaces:
  agent-home:
  uploads:
